name: Build And Push

# Builds the rw-checks-codecollection capability image and pushes a
# multi-arch manifest to GHCR with the tag schema the cc-registry-v2 image
# catalog expects:
#
#     <sanitized-ref>-<cc_sha7>
#
# Where:
#   sanitized-ref = github.ref_name with '/' -> '-' (e.g. "main", "feature-foo", "pr-42")
#   cc_sha7       = first 7 chars of github.sha (this repo's commit)
#
# Unlike this org's Robot codecollections, this image is not built FROM
# rw-base-runtime (see Dockerfile) -- there is no runtime sha to embed in the
# tag, and no BYO-base build-arg to plumb through.
#
# Architecture
# ------------
# The build is split across three jobs so each platform is built natively
# rather than under QEMU emulation:
#
#   prepare        -- compute tag set + push flag ONCE, share with
#                     downstream jobs so they can't drift; also validates
#                     the capability manifest shape once
#   build (matrix) -- one job per platform, each on its own native runner:
#                       linux/amd64 -> ubuntu-latest
#                       linux/arm64 -> ubuntu-24.04-arm
#                     each job:
#                       1. builds the image natively (no QEMU)
#                       2. loads it into the local docker daemon
#                       3. runs the smoke test against the native arch
#                       4. on push, builds again push-by-digest (no tags)
#                          and exports the per-platform digest as an artifact
#   merge          -- pulls the per-platform digests and uses
#                     `docker buildx imagetools create` to stitch them into
#                     a single multi-arch manifest under every tag prepare
#                     computed, then renders capabilities/rw-checks/manifest.yaml
#                     with the resolved digest and uploads it as a build
#                     artifact -- "CI resolves the digest ... and rewrites
#                     this field" per the manifest's own header comment.
#
# `test` runs independently and gates `build`: the SDK's own pytest/ruff
# suite is cheap and fast, and a broken task host should never reach an
# image push.
#
# Build triggers:
#   - push to ANY branch  -> produces a CodeCollectionVersion image for that branch
#   - pull_request to ANY base branch -> produces a "pr-<n>" preview image
#   - workflow_dispatch  -> manual build
#
# We build off non-main branches on purpose: each branch is a candidate CCV
# the catalog can pin to. Path filters below skip rebuilds for pure
# docs / config-only diffs.

on:
  push:
    branches:
      - '**'            # all branches; tag pushes (refs/tags/*) are excluded
    paths-ignore:
      - '**/*.md'
      - '**/*.html'
      - 'LICENSE'
      - '.gitignore'
      - '.gitbook.yaml'
      - '.devcontainer.json'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - 'SUMMARY.md'
      - 'Introduction.md'
      - 'docs/**'
  pull_request:
    # No branches: restriction -> triggers on PRs targeting any base branch
    paths-ignore:
      - '**/*.md'
      - '**/*.html'
      - 'LICENSE'
      - '.gitignore'
      - '.gitbook.yaml'
      - '.devcontainer.json'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - 'SUMMARY.md'
      - 'Introduction.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      push:
        description: "Push the resulting image to GHCR."
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # ===========================================================================
  # test — the SDK's own suite. Independent of prepare/build so it starts
  # immediately; `build` depends on it so a broken task host never reaches
  # an image push.
  # ===========================================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python3 -m pip install --quiet -e ".[dev]"

      - name: pytest
        run: python3 -m pytest -q

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  # ===========================================================================
  # prepare — single source of truth for the tag set and push flag so the
  # matrix builds and the final merge job don't drift. Also validates the
  # capability manifest shape once, up front.
  # ===========================================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_push: ${{ steps.push_flag.outputs.should_push }}
      tags: ${{ steps.meta.outputs.tags }}
      canonical_tag: ${{ steps.meta.outputs.canonical_tag }}
      repo_lc: ${{ steps.meta.outputs.repo_lc }}
      sanitized_ref: ${{ steps.meta.outputs.sanitized_ref }}
      cc_sha: ${{ steps.meta.outputs.cc_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine push flag
        id: push_flag
        run: |
          case "${{ github.event_name }}" in
            push|pull_request)
              echo "should_push=true" >> "$GITHUB_OUTPUT" ;;
            workflow_dispatch)
              echo "should_push=${{ inputs.push }}" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "should_push=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Compute tag set
        id: meta
        run: |
          set -euo pipefail

          # --- this repo's sha ---
          cc_sha="${{ github.sha }}"
          cc_sha7="${cc_sha:0:7}"

          # --- ref name (PRs collapse to "pr-<n>" since github.ref_name on
          #     pull_request is "<n>/merge", which is useless as an OCI tag) ---
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ref_name="pr-${{ github.event.pull_request.number }}"
          else
            ref_name="${{ github.ref_name }}"
          fi
          # OCI tags must match [A-Za-z0-9_.-]{1,128}. We replace '/' with '-'
          # so refs like "release/1.2" survive intact.
          sanitized_ref="$(echo "${ref_name}" | tr '/' '-' | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^-*//;s/-*$//')"

          # --- repo path (GHCR rejects uppercase) ---
          repo_lc="$(echo "${{ env.REGISTRY }}/${{ env.IMAGE }}" | tr '[:upper:]' '[:lower:]')"

          # --- canonical immutable tag the catalog uses for discovery ---
          canonical_tag="${sanitized_ref}-${cc_sha7}"

          # --- moving-pointer aliases (these get re-pointed on every build) ---
          tags=( "${repo_lc}:${canonical_tag}" )
          case "${{ github.event_name }}" in
            push|workflow_dispatch)
              # Branch alias (":main", ":feature-foo"). For push it's the
              # pushed branch; for workflow_dispatch it's the dispatched
              # ref. Both share this alias so a manual re-run of main
              # behaves the same as an auto-push to main.
              tags+=( "${repo_lc}:${sanitized_ref}" )
              # Move ":latest" whenever the destination branch is main.
              if [ "${{ github.ref_name }}" = "main" ]; then
                tags+=( "${repo_lc}:latest" )
              fi
              ;;
            pull_request)
              tags+=( "${repo_lc}:pr-${{ github.event.pull_request.number }}" )
              ;;
          esac

          {
            echo "cc_sha=${cc_sha}"
            echo "sanitized_ref=${sanitized_ref}"
            echo "repo_lc=${repo_lc}"
            echo "canonical_tag=${canonical_tag}"
            printf 'tags=%s\n' "$(IFS=,; echo "${tags[*]}")"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Will publish"
            echo
            for t in "${tags[@]}"; do echo "- \`${t}\`"; done
            echo
            echo "- Codecollection sha: \`${cc_sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate capability manifest
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import sys
          import yaml

          # Keys docs/static-checks/CAPABILITY-CONTRACT.md Part 1 requires on
          # every capability manifest. Keep this list in sync with that file.
          REQUIRED_KEYS = {
              "apiVersion", "capability", "version", "description", "image",
              "execution", "appliesTo", "needs", "setup", "tasks", "retention",
          }

          with open("capabilities/rw-checks/manifest.yaml") as f:
              manifest = yaml.safe_load(f)

          missing = REQUIRED_KEYS - manifest.keys()
          if missing:
              sys.exit(f"capability manifest missing required keys: {sorted(missing)}")
          if manifest["capability"] != "rw-checks":
              sys.exit(f"capability manifest 'capability' must be 'rw-checks', got {manifest['capability']!r}")
          if manifest["execution"].get("mode") != "stateless":
              sys.exit(f"capability manifest execution.mode must be 'stateless', got {manifest['execution'].get('mode')!r}")

          print("capability manifest has all required top-level keys")
          PY

  # ===========================================================================
  # build — parallel native builds. Each matrix leg runs on a runner whose
  # architecture matches the platform it is building, so there's no QEMU
  # emulation cost.
  # ===========================================================================
  build:
    needs: [prepare, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: needs.prepare.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------
      # Phase 1: build natively + load locally so we can exec the smoke
      # test. Per-arch GHA cache scope -- the two matrix legs run in
      # parallel on different runners, so they MUST NOT share a scope.
      # ----------------------------------------------------------------
      - name: Build (native, load)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: rw-checks-codecollection:smoke
          cache-from: type=gha,scope=rw-checks-codecollection-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=rw-checks-codecollection-${{ matrix.arch }}

      - name: Smoke test image
        run: |
          set -euo pipefail
          # Native-arch exec of the image -- verifies the pinned static-check
          # tools and rwtask are on PATH and callable as plain argv (no
          # ENTRYPOINT override needed -- see the Dockerfile's `ENTRYPOINT []`),
          # and that the capability manifest is well-formed.
          docker run --rm rw-checks-codecollection:smoke ruff --version
          docker run --rm rw-checks-codecollection:smoke gitleaks version
          docker run --rm rw-checks-codecollection:smoke rwtask --help
          docker run --rm -v "${{ github.workspace }}:/w" -w /w rw-checks-codecollection:smoke \
            python3 -c "import yaml, sys; d = yaml.safe_load(open('capabilities/rw-checks/manifest.yaml')); assert d['capability'] == 'rw-checks'"

      # ----------------------------------------------------------------
      # Phase 2: only on push -- rebuild push-by-digest. This writes the
      # platform-specific manifest into the registry WITHOUT any
      # human-readable tags. The merge job assembles the multi-arch
      # manifest from these digests under the canonical tags.
      #
      # The build is cheap here: every layer is already in the local
      # buildx cache from Phase 1.
      # ----------------------------------------------------------------
      - name: Build & push by digest
        id: digest_push
        if: needs.prepare.outputs.should_push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.prepare.outputs.repo_lc }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.runwhen.codecollection.commit=${{ github.sha }}
          cache-from: type=gha,scope=rw-checks-codecollection-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=rw-checks-codecollection-${{ matrix.arch }}

      - name: Stage digest for merge job
        if: needs.prepare.outputs.should_push == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.digest_push.outputs.digest }}"
          # The merge job enumerates files in this dir; the filename is
          # the digest minus the "sha256:" prefix.
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: needs.prepare.outputs.should_push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ===========================================================================
  # merge — combine the per-arch digests into the final multi-arch manifest
  # under every tag prepare computed (`docker buildx imagetools create` is a
  # registry-side metadata operation -- no image rebuild), then render
  # capabilities/rw-checks/manifest.yaml with the resolved digest.
  # ===========================================================================
  merge:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_push == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        env:
          REPO_LC: ${{ needs.prepare.outputs.repo_lc }}
          TAG_CSV: ${{ needs.prepare.outputs.tags }}
        run: |
          set -euo pipefail
          # Build the -t <tag> argv from the comma-separated tag list.
          tag_args=()
          IFS=',' read -ra TAGS <<< "${TAG_CSV}"
          for t in "${TAGS[@]}"; do tag_args+=(-t "$t"); done

          # Build the @<digest> argv from the staged digest files.
          digest_args=()
          for f in /tmp/digests/*; do
            d="$(basename "$f")"
            digest_args+=("${REPO_LC}@sha256:${d}")
          done

          echo "Tags:    ${TAGS[*]}"
          echo "Digests: ${digest_args[*]}"

          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"

      - name: Inspect resulting manifest
        id: inspect
        env:
          REPO_LC: ${{ needs.prepare.outputs.repo_lc }}
          CANONICAL_TAG: ${{ needs.prepare.outputs.canonical_tag }}
        run: |
          set -euo pipefail
          out="$(docker buildx imagetools inspect "${REPO_LC}:${CANONICAL_TAG}")"
          echo "${out}"
          digest="$(echo "${out}" | awk '/^Digest:/ {print $2; exit}')"
          if [ -z "${digest}" ]; then
            echo "could not parse the multi-arch manifest digest from imagetools inspect output" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # docs/static-checks/CAPABILITY-CONTRACT.md Part 1: "Digest-pinned
      # image. CI injects it at publish; a tag is not a version." The
      # manifest's own header comment documents this same contract. This
      # does not commit back to the repo -- it publishes the resolved
      # manifest as a build artifact for whatever picks it up into the
      # capability catalog next (that step is not yet defined in this repo).
      - name: Render capability manifest with the resolved digest
        env:
          REPO_LC: ${{ needs.prepare.outputs.repo_lc }}
          DIGEST: ${{ steps.inspect.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/manifest
          sed -E "s|^image: .*|image: ${REPO_LC}@${DIGEST}|" \
            capabilities/rw-checks/manifest.yaml > /tmp/manifest/manifest.yaml
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import sys
          import yaml
          with open("/tmp/manifest/manifest.yaml") as f:
              m = yaml.safe_load(f)
          assert "INJECTED_BY_CI" not in m["image"], f"digest was not injected: {m['image']!r}"
          print(f"rendered manifest image: {m['image']}")
          PY

      - name: Upload rendered manifest
        uses: actions/upload-artifact@v4
        with:
          name: capability-manifest
          path: /tmp/manifest/manifest.yaml
          retention-days: 30

      - name: Summary
        env:
          REPO_LC: ${{ needs.prepare.outputs.repo_lc }}
          CANONICAL_TAG: ${{ needs.prepare.outputs.canonical_tag }}
          TAG_CSV: ${{ needs.prepare.outputs.tags }}
          DIGEST: ${{ steps.inspect.outputs.digest }}
        run: |
          {
            echo "## rw-checks-codecollection build"
            echo
            echo "- Event:               \`${{ github.event_name }}\`"
            echo "- Ref:                 \`${{ github.ref }}\`"
            echo "- Codecollection sha:  \`${{ github.sha }}\`"
            echo "- Canonical tag:       \`${REPO_LC}:${CANONICAL_TAG}\`"
            echo "- Digest:              \`${DIGEST}\`"
            echo "- Pushed:              \`true\`"
            echo
            echo "### Published manifest"
            IFS=',' read -ra TAGS <<< "${TAG_CSV}"
            for t in "${TAGS[@]}"; do echo "- \`${t}\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
