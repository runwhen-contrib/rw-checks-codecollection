# Capability manifest for rw-checks. Shape is defined by
# docs/static-checks/CONTRACT.md in runwhen-auto — that file is binding;
# if this needs to diverge from it, stop and raise it there first.
#
# `image` below is a build-time placeholder. CI resolves the digest of
# the image it just pushed and rewrites this field to
# ghcr.io/runwhen-contrib/rw-checks-codecollection@sha256:<actual digest>
# before the manifest is picked up by the catalog. Do not hand-edit the
# placeholder; do not ship it as-is.
capability: rw-checks
version: "0.1.0"
image: ghcr.io/runwhen-contrib/rw-checks-codecollection@sha256:INJECTED_BY_CI
scope: resource                       # resource | connection | workspace
execution: queued                     # queued | sync   ("does it need a pod?")
retention: all                        # all | on_failure | none
applies_to:                           # selector; ANY entry matching => applies
  - platform: github
    type: repository
    where: { language: python }       # v1 predicate: flat key -> exact value (case-insensitive)
needs:
  worktree: required                  # required | none
  credentials: []
  network: []
outputs: sarif
operations:
  - name: ruff
    run: ["ruff", "check", "--output-format=sarif", "."]
    applies_to:                       # optional; narrows the capability-level selector
      - { platform: github, type: repository, where: { language: python } }
  - name: gitleaks
    run: ["gitleaks", "detect", "--source", ".", "--report-format", "sarif",
          "--report-path", "/dev/stdout", "--no-banner", "--exit-code", "0"]
