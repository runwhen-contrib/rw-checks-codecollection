name: Build And Push

# Builds this repo's TWO capability images -- rw-checks (stateless) and
# rw-worktree (stateful) -- and pushes a multi-arch manifest for each to
# GHCR under its own name. Image == capability, 1:1: the two have
# different execution modes and the runner keys an executor pool per image,
# so they are separate images even though they live in one repo.
#
# `test` runs this repo's own suite and gates the images: a broken
# capability never reaches an image push.
#
# `images` calls runwhen-capability's reusable capability-image workflow
# once per image. It computes the tags, checks the manifest, bakes in the
# com.runwhen.capability.manifest.v1 / schemas.v1 labels from `rwtask
# label`, builds natively on amd64 and arm64, smoke-tests the image and
# pushes. Tags:
#
#     <sanitized-ref>-<sha7>   every branch build (plus <ref>, and latest on main)
#     pr-<n>-<sha7>            pull requests (plus pr-<n>)
#     v<semver>                a pushed semver tag, with no aliases
#
# Keep the workflow's tag (@v...) and the runwhen-capability pin in
# pyproject.toml on the same release.
#
# Build triggers:
#   - push to ANY branch  -> an image for that branch, a version the catalog can pin
#   - pull_request to ANY base branch -> a "pr-<n>" preview image (a fork's PR builds
#                                        and smoke-tests, but does not push)
#   - push of a semver tag (v*) -> the release image for that tag
#   - workflow_dispatch  -> manual build
#
# Path filters below skip rebuilds for pure docs / config-only diffs.

on:
  push:
    branches:
      - '**'            # all branches (refs/heads/*)
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'  # semver release tags only -- see the tag scheme above
    paths-ignore:
      - '**/*.md'
      - '**/*.html'
      - 'LICENSE'
      - '.gitignore'
      - '.gitbook.yaml'
      - '.devcontainer.json'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - 'SUMMARY.md'
      - 'Introduction.md'
      - 'docs/**'
  pull_request:
    # No branches: restriction -> triggers on PRs targeting any base branch
    paths-ignore:
      - '**/*.md'
      - '**/*.html'
      - 'LICENSE'
      - '.gitignore'
      - '.gitbook.yaml'
      - '.devcontainer.json'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - 'SUMMARY.md'
      - 'Introduction.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      push:
        description: "Push the resulting images to GHCR."
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  # ===========================================================================
  # test — the SDK's own suite. Independent of prepare/build so it starts
  # immediately; `build` depends on it so a broken task host never reaches
  # an image push, for either capability.
  # ===========================================================================
  test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (full history, all branches) -- not just this repo's
      # own commits: the schema immutability check below needs to diff the
      # working tree's capabilities/*/schemas against a base ref (the PR's
      # target branch, or the commit before this push), which a shallow
      # checkout would not have.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python3 -m pip install --quiet -e ".[dev]"

      - name: pytest
        run: python3 -m pytest -q

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      # A schema is exported, not hand-written: every file listed under
      # [tool.rwtask.schemas] in pyproject.toml must be exactly what
      # `rwtask schemas` writes from the SDK's models right now, and must
      # exist. If a model changed, replace its entry there with the next
      # <name>.v<N+1>.json and commit what `make schemas` writes -- never
      # edit a published schema file.
      - name: Check schemas are up to date with the models
        run: rwtask schemas --check

      # Which commit to compare capabilities/*/schemas against for the
      # immutability check below. A tag push has no cheap "previous commit"
      # here (Contract 2's canonical release tag) and is built from an
      # already-tested branch commit anyway, so it is skipped rather than
      # looking up the previous tag.
      - name: Determine schema immutability base
        id: immutability_base
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "base=origin/${BASE_REF}" >> "$GITHUB_OUTPUT"
          elif [ "${EVENT_NAME}" = "push" ] && [ "${REF_TYPE}" != "tag" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "base=${BEFORE_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "base=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check schema immutability
        if: steps.immutability_base.outputs.skip != 'true'
        env:
          IMMUTABILITY_BASE: ${{ steps.immutability_base.outputs.base }}
        run: |
          python3 scripts/check_schema_immutability.py --base "${IMMUTABILITY_BASE}"

  # ===========================================================================
  # images -- one call of the shared capability-image workflow per image.
  # ===========================================================================
  images:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - capability: rw-checks
            dockerfile: Dockerfile.rw-checks
            image-name: rw-checks-codecollection
            execution-mode: stateless
            # The tool SBOM rides the image for registry scanners; the
            # smoke test checks the copy in the image is this file.
            sbom: sbom/tools.cdx.json
            smoke-command: |
              docker run --rm "${IMG}" ruff --version
              docker run --rm "${IMG}" gitleaks version
          - capability: rw-worktree
            dockerfile: Dockerfile.rw-worktree
            image-name: rw-worktree-codecollection
            execution-mode: stateful
            sbom: ''
            # rw-worktree ships git and no lint/secret-scan tooling. Assert
            # the absence so a Dockerfile edit that ships them is caught.
            smoke-command: |
              docker run --rm "${IMG}" git --version
              for tool in ruff gitleaks; do
                if docker run --rm "${IMG}" sh -c "command -v ${tool}" > /dev/null 2>&1; then
                  echo "rw-worktree image must not ship ${tool}" >&2
                  exit 1
                fi
              done
    permissions:
      contents: read
      packages: write
    uses: runwhen-contrib/runwhen-capability/.github/workflows/capability-image.yml@v0.1.0
    with:
      capability: ${{ matrix.capability }}
      dockerfile: ${{ matrix.dockerfile }}
      image-name: ${{ matrix.image-name }}
      execution-mode: ${{ matrix.execution-mode }}
      sbom: ${{ matrix.sbom }}
      smoke-command: ${{ matrix.smoke-command }}
      push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
