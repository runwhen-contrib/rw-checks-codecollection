# credential in setup, a task reading the materialised tree) to exercise
# host.run_request's setup-output caching across requests to the same
# scope -- the mcp.v1 sync read path.
capability: rw-worktree-sync-fixture
version: "0.0.0"
setup:
  task: open
tasks:
  - name: read
