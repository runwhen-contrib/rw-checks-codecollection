[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "runwhen-capability"
version = "0.1.0"
description = "SDK and task host (rwtask) for RunWhen capability images"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6",
    "requests>=2.31",
]

[project.scripts]
rwtask = "runwhen_capability.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "responses>=0.25",
    "ruff>=0.16",
]

[tool.setuptools.packages.find]
where = ["sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# tests/fixtures/repo and tests/fixtures/*.sarif* are deliberately "dirty"
# fixture data static-check tools are meant to flag -- not code we lint.
extend-exclude = ["tests/fixtures/repo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
