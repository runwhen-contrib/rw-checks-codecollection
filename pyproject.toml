[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rw-checks-codecollection"
# Not published. Each capability's own version lives in its manifest.yaml.
version = "0.0.0"
description = "Static-check (rw-checks) and repository tree (rw-worktree) capabilities for RunWhen"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    # The capability SDK and its rwtask task host, pinned to a release tag.
    "runwhen-capability @ git+https://github.com/runwhen-contrib/runwhen-capability@v0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.16",
]

[tool.setuptools]
# Nothing to package: each capability directory is loaded by path at run
# time. Installing this project installs its dependencies, the SDK first.
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# tests/fixtures/repo and tests/fixtures/*.sarif* are deliberately "dirty"
# fixture data static-check tools are meant to flag -- not code we lint.
extend-exclude = ["tests/fixtures/repo", "tests/fixtures/sample-repo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
