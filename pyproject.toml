[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rw-checks-codecollection"
# Not published. Each capability's own version lives in its manifest.yaml.
version = "0.0.0"
description = "Static-check (rw-checks) and repository tree (rw-worktree) capabilities for RunWhen"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    # The capability SDK and its rwtask task host, pinned to a release tag.
    "runwhen-capability @ git+https://github.com/runwhen-contrib/runwhen-capability@v0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.16",
]

[tool.setuptools]
# Nothing to package: each capability directory is loaded by path at run
# time. Installing this project installs its dependencies, the SDK first.
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# tests/fixtures/repo and tests/fixtures/*.sarif* are deliberately "dirty"
# fixture data static-check tools are meant to flag -- not code we lint.
extend-exclude = ["tests/fixtures/repo", "tests/fixtures/sample-repo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# Output schemas, exported from the SDK's models by `rwtask schemas` (`make
# schemas`); CI runs `rwtask schemas --check`. One entry per
# `tasks[].outputs.<name>.schema` a manifest declares.
#
# A file is named <name>.v<N>.json, and N is the schema version. Once
# published, a file is never edited or deleted
# (scripts/check_schema_immutability.py enforces that in CI). When a model's
# shape changes in a way a schema consumer must handle differently, replace
# its entry here with <name>.v<N+1>.json, run `make schemas`, and move the
# manifest's `schema:` ref to the new file; the old file stays on disk.
[tool.rwtask.schemas."capabilities/rw-checks"]
"findings.v1.json" = "runwhen_capability.models:FindingsResult"

[tool.rwtask.schemas."capabilities/rw-worktree"]
"read.v1.json" = "runwhen_capability.models:ReadResult"
"grep.v1.json" = "runwhen_capability.models:GrepResult"
"ls.v1.json" = "runwhen_capability.models:LsResult"
"query.v1.json" = "runwhen_capability.models:QueryResult"
