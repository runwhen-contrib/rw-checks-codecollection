[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# This repo's own dev/test environment (`pip install -e ".[dev]"`), not a published
# package: it holds capabilities, scripts and tests, no importable code. What it installs
# is the runwhen-capability SDK at the tag pinned in requirements-sdk.txt (the one place
# the pin lives), plus the test tools.
[project]
name = "rw-checks-codecollection"
version = "0.0.0"
description = "RunWhen capability images: rw-checks, rw-worktree, artifact-tools"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "responses>=0.25",
    "ruff>=0.16",
]

[tool.setuptools]
packages = []

[tool.setuptools.dynamic]
dependencies = { file = ["requirements-sdk.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# tests/fixtures/repo and tests/fixtures/*.sarif* are deliberately "dirty"
# fixture data static-check tools are meant to flag -- not code we lint.
extend-exclude = ["tests/fixtures/repo", "tests/fixtures/sample-repo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
