      tree:    { from: "${setup.tree}" }
      changed: { from: "${setup.changed}" }
    outputs:
      findings: { kind: rw.findings.v1, schema: ./schemas/findings.json }

  - name: tflint
    description: Terraform lint and static analysis
    inputs:
      tree:    { from: "${setup.tree}" }
      changed: { from: "${setup.changed}" }
    outputs:
      findings: { kind: rw.findings.v1, schema: ./schemas/findings.json }

  - name: shellcheck
    description: Shell script lint and static analysis
    inputs:
      tree:    { from: "${setup.tree}" }
      changed: { from: "${setup.changed}" }
    outputs:
      findings: { kind: rw.findings.v1, schema: ./schemas/findings.json }

  - name: hadolint
    description: Dockerfile lint and best-practice analysis
    inputs:
      tree:    { from: "${setup.tree}" }
