# Declarative source of truth for every static-check binary this image
# installs from a GitHub release.
#
# This file is HAND-EDITED; sbom/tools.cdx.json is GENERATED from it by
# scripts/gen_tool_sbom.py, which downloads each artifact and records its
# sha256. The Dockerfile installs from the SBOM, never from this file, so a
# version bump that has not been re-hashed cannot reach an image.
#
# Why an SBOM rather than a bespoke lock file: a statically linked binary
# copied into /usr/local/bin is INVISIBLE to every scanner that works off a
# package database (Trivy, Grype, osv-scanner all read dpkg/pip metadata).
# Without this file such a scan reports a clean image while ~15 unmanaged
# binaries sit in it. CycloneDX with a PURL per component is what makes them
# visible to CVE matching.
#
# `purl` follows the package-url spec's `github` type; `binary` is the file
# name inside the archive (or the downloaded file itself, for `kind: binary`).

tools:
  - name: shellcheck
    version: "0.10.0"
    purl: pkg:github/koalaman/shellcheck@v0.10.0
    kind: tar.xz
    binary: shellcheck
    urls:
      amd64: https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
      arm64: https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.aarch64.tar.xz

  - name: hadolint
    version: "2.12.0"
    purl: pkg:github/hadolint/hadolint@v2.12.0
    kind: binary
    binary: hadolint
    urls:
      amd64: https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
      arm64: https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-arm64

  - name: actionlint
    version: "1.7.7"
    purl: pkg:github/rhysd/actionlint@v1.7.7
    kind: tar.gz
    binary: actionlint
    urls:
      amd64: https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
      arm64: https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_arm64.tar.gz

  - name: gitleaks
